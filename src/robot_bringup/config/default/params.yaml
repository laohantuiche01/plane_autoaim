/**:
  ros__parameters:
    use_sim_time: false

# Camera Driver (Hikrobot)
hik_camera:
  ros__parameters:
    use_sensor_data_qos: true
    exposure_time: 2500.0
    gain: 10.0
    frame_rate: 150.0
    delay_ratio: 0.0
    width: 1440
    height: 1080
    offset_x: 0
    offset_y: 0
    bit_depth: "Bits_8"
    k: [1804.24343, 0.0, 698.33816, 0.0, 1801.62514, 576.52832, 0.0, 0.0, 1.0]
    d: [-0.080533, 0.135494, -0.000354, 0.000057, 0.000000]

# Armor Detector
armor_detector:
  ros__parameters:
    use_ba: true
    target_frame: "odom"
    debug: true
    binary_thres: 160
    enemy_color: "red"
    classifier_threshold: 0.8
    ignore_classes: ["negative"]
    use_pca: true
    
    light:
      min_ratio: 0.08
      max_ratio: 0.4
      max_angle: 40.0
      color_diff_thresh: 25

    armor:
      min_light_ratio: 0.6
      min_small_center_distance: 0.8
      max_small_center_distance: 3.2
      min_large_center_distance: 3.2
      max_large_center_distance: 5.0
      max_angle: 35.0

    armor_detector:
      result_img:
        jpeg_quality: 50
      binary_img:
        jpeg_quality: 50

# Armor Solver
armor_solver:
  ros__parameters:
    bullet_speed: 25.0
    debug: true
    debug_img_freq: 60.0
    max_lost_duration: 1.0
    min_detect_count: 5
    odom_frame: odom
    outpost:
      adaptive_tracking: false
      max_pos_cov: 3.0
      max_yaw_cov: 1.0
      min_update_count: 5
      q_alpha: 0.1
      q_geo: 0.0001
      sigma_pos: 0.1
      sigma_yaw: 0.3
      # Spherical R parameters
      r_range: 0.01
      r_range_k: 0.5
      r_angle: 0.0003
      r_yaw: 0.05
      r_yaw_adaptive_factor: 50.0
      r_yaw_viewing_k: 10.0
    robot:
      adaptive_tracking: false
      max_pos_cov: 2.2
      max_yaw_cov: 1.0
      min_update_count: 5
      q_alpha: 0.1
      q_geo: 0.001
      sigma_pos: 20.0
      sigma_yaw: 2.0
      # Spherical R parameters
      r_range: 0.01
      r_range_k: 0.5
      r_angle: 0.0003
      r_yaw: 0.5
      r_yaw_adaptive_factor: 50.0
      r_yaw_viewing_k: 10.0
    trajectory:
      aim_delay_offset: 0.0
      dt: 0.05
      hit_delay_offset: 0.0
      num_points: 11
      omega_high: 4.0
      omega_low: 1.5
      switch_concentration: 20.0
    ukf_alpha: 0.001
    ukf_beta: 2.0
    ukf_kappa: 0.0
    use_sim_time: false

# Ballistics Node
ballistics_node:
  ros__parameters:
    bullet_speed: 25.0
    gimbal_frame: "gimbal_link"
    true_angle_tolerance: 0.05
    aim_angle_tolerance: 0.05
    hit_yaw_offset: 0.0
    hit_pitch_offset: 0.0
    aim_yaw_offset: 0.00872
    aim_pitch_offset: -0.016
    enable_sg_yaw: false
    sg_yaw_order: 2
    enable_sg_pitch: false
    sg_pitch_order: 2

# Manager
robot_manager:
  ros__parameters:
    detector_name: "armor_detector"
    solver_name: "armor_solver"

# Communication
robot_communication:
  ros__parameters:
    serial_name: "/dev/ttyACM0"
    camera_x: 0.0
    camera_y: 0.0
    camera_z: 0.0
    camera_roll: 0.0
    camera_pitch: 0.0
    camera_yaw: 0.0