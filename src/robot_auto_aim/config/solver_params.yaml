armor_solver:
  ros__parameters:
    odom_frame: "odom"
    max_lost_duration: 1.0
    min_detect_count: 5
    ukf_alpha: 0.001
    ukf_beta: 2.0
    ukf_kappa: 0.0

    robot:
      q_x: 0.001
      q_y: 0.001
      q_z: 0.001
      q_vx: 0.1
      q_vy: 0.01
      q_vz: 0.1
      q_yaw: 0.01
      q_v_yaw: 0.001
      q_geo: 0.0001
      r_x: 0.5
      r_y: 0.5
      r_z: 0.5
      r_yaw: 0.05
      r_yaw_adaptive_factor: 50.0
      adaptive_tracking: false
      q_alpha: 0.1
      dist_scale_coeff: 0.1
      z_scale_coeff: 5.0

    outpost:
      q_x: 0.001
      q_y: 0.001
      q_z: 0.001
      q_yaw: 0.01
      q_v_yaw: 0.1
      q_geo: 0.0001
      r_x: 0.5
      r_y: 0.5
      r_z: 0.5
      r_yaw: 0.05
      r_yaw_adaptive_factor: 50.0
      adaptive_tracking: false
      q_alpha: 0.1
      dist_scale_coeff: 0.1
      z_scale_coeff: 5.0