# Iceoryx configuration file for 1440x1080 @ 250Hz images
# Each frame is ~4.5MB. We allocate 8MB chunks to be safe.

[general]
version = 1

[[segment]]
# For small messages (TF, metadata)
[[segment.mempool]]
size = 16384
count = 2000

# For medium messages (Armors, etc.)
[[segment.mempool]]
size = 262144
count = 500

# For high-res 250Hz images (4.5MB per frame)
# 100 chunks * 8MB = 800MB total shared memory for images
[[segment.mempool]]
size = 8388608
count = 100
